[package]
name = "photo2video"
version = "0.14.0"
edition = "2021"
# 下面兩行會被 build.rs 經 winresource 讀到（未明寫時的 CompanyName、
# FileDescription 來源）。空白的公司名稱是防毒啟發式掃描的加權指標之一
authors = ["Yellow Huang"]
description = "photo2video 照片轉影片、去煙霧與夜空後製工具"

[dependencies]
eframe = "0.31"
egui = "0.31"
rfd = "0.15"
ffmpeg-sidecar = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "tiff"] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
# 單一編譯單元讓 LTO 跨模組最佳化完整發揮（建置較慢、執行較快）
codegen-units = 1
# 去除符號表：執行檔更小，自動更新下載更快
strip = "symbols"

# 隱藏 release 版執行時的黑色主控台視窗（在 main.rs 以 windows_subsystem 屬性處理）
