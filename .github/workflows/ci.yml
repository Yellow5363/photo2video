name: CI

# 每次推到 master（或開 PR）都建置一次並跑測試：這台開發機沒有 Rust 工具鏈，
# 改完的程式在這裡先確認編得過、測試沒紅，再打 tag 發版
on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust 建置快取
        uses: Swatinem/rust-cache@v2

      # 資源回收筒那條測試在 GitHub 的執行器上會紅：TEMP 是 8.3 短檔名
      # （RUNNER~1），回收筒還原出來的是長檔名，路徑比對永遠不同。本機跑得過，
      # 只在這裡跳過
      - name: 建置並跑測試
        run: cargo test -- --skip extra_files_go_to_the_recycle_bin_and_come_back
